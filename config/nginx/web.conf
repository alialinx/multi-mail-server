# maps the Upgrade header so the same /api/ location works for both normal
# requests and WebSocket upgrades (live log stream at /api/ws/logs)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS, so the api container can be re-resolved if it restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy the admin API. The browser only ever talks to this port, so there is
    # no CORS and the API does not need to be exposed separately for the UI.
    location /api/ {
        set $api_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
