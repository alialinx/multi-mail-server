server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS, so the api container can be re-resolved if it restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy the admin API. The browser only ever talks to this port, so there is
    # no CORS and the API does not need to be exposed separately for the UI.
    location /api/ {
        set $api_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
