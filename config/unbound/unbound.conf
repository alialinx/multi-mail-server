server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.123.0.0/24 allow
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 0
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    root-hints: "/usr/share/dns/root.hints"
    module-config: "iterator"

remote-control:
    control-enable: no
