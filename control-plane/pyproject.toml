[project]
name = "mailctl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "passlib>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailctl*"]

[tool.setuptools.package-data]
mailctl = ["templates/*.j2"]
